name: Resolve reproducible lockfile

on:
  push:
    branches: [codex/fix-blog-build-20261012]

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve lockfile without installing packages
        run: pnpm install --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          retention-days: 3
